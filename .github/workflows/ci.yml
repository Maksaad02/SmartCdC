name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une nouvelle poussee annule l'execution precedente de la meme branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # verify = compile + tests + (plus tard) tests d'integration ; un seul passage.
      - name: Build and test
        run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  rag:
    name: RAG (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rag-test-reports
          path: rag/target/surefire-reports/

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci : respecte package-lock.json, comme le Dockerfile.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  images:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, rag, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, rag, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: smartcdc-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, rag, frontend]
    env:
      HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      # Configuration jetable, generee pour l'occasion : aucun secret du depot ni de GitHub n'est utilise.
      - name: Generer une configuration de test
        run: |
          {
            echo "PUBLIC_URL=http://localhost:8080"
            echo "HTTP_PORT=8080"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_USER=recouv_app"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=recouvrag_db"
            echo "POSTGRES_USER=recouv_rag"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "CHATBOT_API_KEY=$(openssl rand -base64 32)"
            echo "MAIL_USERNAME=e2e@example.com"
            echo "MAIL_PASSWORD=inutilise"
            echo "OPENAI_API_KEY=sk-e2e-inutilise"
            echo "ADMIN_EMAIL=admin@smartcdc.test"
            echo "ADMIN_PASSWORD=Adm1n-Test-Passw0rd!"
            echo "COOKIE_SECURE=true"
            ./scripts/generate-jwt-keys.sh
          } > .env

      - name: Demarrer la pile
        run: docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Lancer les parcours
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Journaux des services
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail 200
      - name: Arreter la pile
        if: always()
        run: docker compose -f docker-compose.yml down -v
