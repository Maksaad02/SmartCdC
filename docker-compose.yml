# SmartCDC : pile complete (MySQL, pgvector, backend, rag, frontend).
#
#   cp .env.example .env   # puis renseigner les secrets
#   docker compose up -d --build
#
# Seul le frontend est publie : nginx sert l'application et relaie /api vers le
# backend et /chat vers le chatbot. Les bases ne sont jamais exposees.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requis}
      MYSQL_DATABASE: rec_ouv_db
      MYSQL_USER: ${MYSQL_USER:-recouv_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    networks: [data]
    logging: *default-logging

  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recouvrag_db}
      POSTGRES_USER: ${POSTGRES_USER:-recouv_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m
    networks: [data]
    logging: *default-logging

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/rec_ouv_db?serverTimezone=UTC&sslMode=PREFERRED
      DB_USERNAME: ${MYSQL_USER:-recouv_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Cle PRIVEE de signature des jetons : reste sur le backend, jamais donnee au chatbot.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY requis (scripts/generate-jwt-keys.sh)}
      # Cookie de session : Secure impose HTTPS. Ne le desactiver que pour un test en HTTP pur.
      APP_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CHATBOT_API_KEY: ${CHATBOT_API_KEY:?CHATBOT_API_KEY requis (32 caracteres minimum)}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME requis}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD requis}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL requis}
    mem_limit: 768m
    networks: [data, edge]
    logging: *default-logging

  rag:
    build: ./rag
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY requis}
      DATABASE_URL: jdbc:postgresql://pgvector:5432/${POSTGRES_DB:-recouvrag_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-recouv_rag}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_API_KEY: ${CHATBOT_API_KEY}
      # Cle PUBLIQUE : le chatbot peut verifier un jeton mais pas en fabriquer.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY requis (scripts/generate-jwt-keys.sh)}
      FRONTEND_ORIGIN: ${PUBLIC_URL}
    mem_limit: 768m
    networks: [data, edge]
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_CHATBOT_API_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
    mem_limit: 128m
    networks: [edge]
    logging: *default-logging

volumes:
  mysql_data:
  pgvector_data:

networks:
  # Les bases n'ont aucun acces Internet ni depuis Internet.
  data:
    internal: true
  # Sortie autorisee : SMTP (backend) et OpenAI (rag).
  edge:
