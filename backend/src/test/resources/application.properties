# Application
spring.application.name=recouvTech_test
debug=true

# In-memory H2 database for tests (no MySQL needed)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
# Flyway desactive en test : les migrations sont ecrites en SQL MySQL (ENUM,
# variables de session) et ne s'executeraient pas sur H2. Hibernate construit le
# schema directement depuis les entites pour ces tests rapides ; la validite des
# migrations elles-memes se verifie contre un vrai MySQL (docker), pas ici.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Valeurs factices, propres aux tests : aucun secret reel ne doit etre versionne.
# Cles RSA generees au demarrage du contexte de test : aucune cle, meme factice, n'est versionnee.
app.jwt.ephemeral-keys=true
app.jwt.access-ttl=PT15M
app.jwt.refresh-ttl=PT12H
app.jwt.issuer=smartcdc
recouv.api.external.key=test-only-external-api-key-0123456789abcdef
app.cors.allowed-origins=http://localhost:*,https://front.test

# Les tests partagent une seule adresse IP : quota IP large pour ne pas se gener entre
# eux (le quota par identifiant, lui, est teste tel quel).
app.security.login.ip-per-minute=1000
app.security.login.user-per-minute=5

# Memes limites de pagination que la production (ce fichier remplace application.properties
# pendant les tests : tout reglage dont un test depend doit etre repete ici).
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200
# Les Page sont serialisees en { content, page: {size, number, totalElements, totalPages} } :
# forme stable, sans les champs internes de PageImpl.
spring.data.web.pageable.serialization-mode=via_dto

# Comptage des requetes SQL (tests anti N+1).
spring.jpa.properties.hibernate.generate_statistics=true

# Disable Thymeleaf (if not used in tests)
spring.thymeleaf.enabled=false

# Disable mail (if not tested)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

# Logging (optional)
logging.level.org.springframework.security=DEBUG
logging.level.com.recouvtech.recouvback.filter=DEBUG
