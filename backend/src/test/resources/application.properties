# Application
spring.application.name=recouvTech_test
debug=true

# In-memory H2 database for tests (no MySQL needed)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Flyway desactive en test : les migrations sont ecrites en SQL MySQL (ENUM,
# variables de session) et ne s'executeraient pas sur H2. Hibernate construit le
# schema directement depuis les entites pour ces tests rapides ; la validite des
# migrations elles-memes se verifie contre un vrai MySQL (docker), pas ici.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT test values
app.secret-key=sMiI3O/LGN4s6pZNhDJT3xKcBHvMfLQmaytxbWSv9Xk=
app.expiration-time=3600000

# Disable Thymeleaf (if not used in tests)
spring.thymeleaf.enabled=false

# Disable mail (if not tested)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

# Logging (optional)
logging.level.org.springframework.security=DEBUG
logging.level.com.recouvtech.recouvback.filter=DEBUG
