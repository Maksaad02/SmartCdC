# Application
spring.application.name=recouvTech_db

# Charge le fichier .env local s'il existe (il est git-ignore).
# "optional:" : en production le fichier est absent et les valeurs viennent des
# vraies variables d'environnement. Si ni l'un ni l'autre ne fournit les secrets,
# le demarrage echoue volontairement plutot que de retomber sur une valeur par
# defaut embarquee dans le binaire.
spring.config.import=optional:file:./.env[.properties]
debug=false

# Database (updated for Docker MySQL service)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rec_ouv_db?serverTimezone=UTC&useSSL=true&requireSSL=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.pool-name=RecouvBackPool
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
# Duree de vie inferieure au wait_timeout de MySQL (8 h par defaut) mais assez longue
# pour ne pas reconnecter en boucle (TLS + authentification a chaque fois).
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepaliveTime=300000
spring.datasource.hikari.validation-timeout=3000
# Alerte si une connexion reste empruntee plus de 20 s (fuite ou transaction trop longue).
spring.datasource.hikari.leak-detection-threshold=20000

# JPA/Hibernate
# Le schema est gere par Flyway (src/main/resources/db/migration).
# validate : Hibernate verifie que les entites correspondent au schema et refuse
# de demarrer sinon, au lieu de modifier la base en silence. "update" ne savait
# pas exprimer la conversion des montants en DECIMAL ni le remplissage de
# organisation_id, et se serait mal comporte sur des tables peuplees.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Pas de baseline-on-migrate : une base non vide sans historique Flyway doit faire
# echouer le demarrage (elle n'a pas ete creee par ces migrations), et non etre
# declaree "deja a jour" sans que V1 ait jamais ete appliquee.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
# Dialecte detecte automatiquement (MySQL8Dialect est deprecie et fige la version).

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# Development Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.transaction=WARN

# Amorcage du premier compte ADMIN (voir AdminInitializer).
# Ignore des qu'au moins un utilisateur existe en base.
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrateur}

# Signature des jetons : RS256, cle privee RSA (PKCS#8) fournie par JWT_PRIVATE_KEY. Seul le backend
# la detient ; le chatbot ne recoit que la cle publique. Generer avec scripts/generate-jwt-keys.sh.
app.jwt.private-key=${JWT_PRIVATE_KEY}
app.jwt.issuer=smartcdc
# Jeton d'acces court (en memoire cote navigateur) ; la session se prolonge par un jeton de
# renouvellement (cookie httpOnly) valable 12 h et renouvele a chaque utilisation.
app.jwt.access-ttl=PT15M
app.jwt.refresh-ttl=PT12H

# Spring Security Debugging
logging.level.org.springframework.security=WARN
logging.level.com.recouvtech.recouvback.filter=WARN

# SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
logging.level.org.springframework.mail=WARN
logging.level.org.springframework.boot.autoconfigure.mail=WARN

# CORS : origines autorisees (separees par des virgules). Le defaut n'a de sens
# qu'en developpement local ; le profil prod exige CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Ne jamais renvoyer de trace de pile ni de message interne aux clients.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Pagination : 20 par page par defaut, 200 au maximum (une taille demandee au-dela
# est ramenee a 200 : un client ne peut pas reclamer toute la table d'un coup).
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200
# Les Page sont serialisees en { content, page: {size, number, totalElements, totalPages} } :
# forme stable, sans les champs internes de PageImpl.
spring.data.web.pageable.serialization-mode=via_dto

# Anti brute-force sur /api/login : tentatives autorisees par minute.
app.security.login.ip-per-minute=20
app.security.login.user-per-minute=5

# Derriere le proxy nginx du front : l'adresse IP du client vient de X-Forwarded-For
# (le valve Tomcat ne fait confiance qu'aux proxys internes, cf. profil prod).
server.forward-headers-strategy=native

# SMTP : delais de connexion, d'ecriture et de lecture (ms). Sans eux, un serveur
# de messagerie muet bloquerait le thread indefiniment.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Actuator : uniquement les sondes de sante, sans detail. La sante SMTP est
# exclue : une panne passagere de Gmail ne doit pas faire tomber le conteneur.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false

# External Chatbot API Security
recouv.api.external.key=${CHATBOT_API_KEY}

# --- Import automatique des factures PDF (Claude, OpenRouter ou OpenAI) ---
# Premiere cle renseignee dans cet ordre : ANTHROPIC_API_KEY, OPENROUTER_API_KEY, OPENAI_API_KEY.
# Sans aucune cle, la fonctionnalite est desactivee (le bouton d'import est masque).
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openai.api-key=${OPENAI_API_KEY:}
app.extraction.modele-claude=claude-opus-5-5
# Modele OpenRouter : identifiant "fournisseur/modele" (ex. openai/gpt-4o), surchargeable par variable.
app.extraction.modele-openrouter=${OPENROUTER_MODEL:openai/gpt-4o}
app.extraction.modele-openai=gpt-4o
# Lectures de factures par utilisateur et par heure (chaque lecture est facturee par le fournisseur).
app.extraction.par-heure=30
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
