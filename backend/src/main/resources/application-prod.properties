# Profil de production (SPRING_PROFILES_ACTIVE=prod).
#
# Ici, aucune valeur par defaut pour ce qui identifie l'environnement : un
# deploiement mal configure doit echouer au demarrage plutot que de pointer
# silencieusement vers localhost ou d'accepter n'importe quelle origine.

spring.datasource.url=${DB_URL}

# Origines navigateur autorisees. Vide/absent = refus au demarrage. Inutile de
# l'elargir quand le proxy nginx du front sert /api sur la meme origine.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.thymeleaf.cache=true
debug=false

# --- Observabilite ---
# Journaux JSON (ECS) sur la sortie standard : exploitables par un agregateur, avec l'identifiant de
# correlation (requestId) sur chaque ligne. La rotation est assuree par Docker (voir compose).
logging.structured.format.console=ecs
logging.structured.ecs.service.name=smartcdc-backend

# Actuator sur un port d'administration separe (jamais publie hors du reseau Docker) : sante et
# metriques Prometheus. Le port public 8080 n'expose plus aucun endpoint actuator.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=smartcdc-backend
