# Profil de production (SPRING_PROFILES_ACTIVE=prod).
#
# Rien de ce qui identifie l'environnement n'a de valeur par defaut ici : un deploiement
# mal configure doit echouer au demarrage plutot que de viser localhost.

# PORT : convention des plateformes (Render, Heroku...) ; 8082 sinon.
server.port=${PORT:8082}

recouv.backend.base-url=${BACKEND_BASE_URL}
recouv.frontend.origin=${FRONTEND_ORIGIN}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}

# --- Observabilite ---
logging.structured.format.console=ecs
logging.structured.ecs.service.name=smartcdc-rag

# Actuator sur un port d'administration separe, jamais publie. Spring AI y expose deja ses metriques
# (jetons consommes, latence, erreurs par modele).
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=smartcdc-rag
