spring.application.name=recouvChatbot_rag
server.port=8082

# ---------------------------------------------------------------- OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
# Reponses factuelles et reproductibles plutot que creatives.
spring.ai.openai.chat.options.temperature=0.2
# Plafond de sortie par reponse : borne le cout d'une question (et d'une injection
# qui demanderait "reponds en 10 000 mots").
spring.ai.openai.chat.options.max-tokens=1000
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Delais reseau vers OpenAI. Sans eux, un fournisseur bloque bloquait la requete
# indefiniment.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s
# Par defaut Spring AI retente 10 fois avec un delai x5 (plusieurs minutes) : bien
# au-dela du delai d'attente de l'interface. 2 essais courts suffisent.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s

# ---------------------------------------------------------------- Backend SmartCDC
recouv.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
recouv.backend.api-key=${BACKEND_API_KEY}
recouv.backend.connect-timeout=3s
recouv.backend.read-timeout=10s

# Cle PUBLIQUE de verification des jetons emis par le backend (RS256). Le chatbot valide le jeton
# de l'utilisateur et le retransmet, afin d'heriter exactement des droits de l'agent appelant. Il ne
# possede aucune cle capable de signer : s'il etait compromis, il ne pourrait pas forger de jeton.
app.jwt.public-key=${JWT_PUBLIC_KEY}
app.jwt.issuer=smartcdc

# Origine autorisee du front (plus de wildcard).
recouv.frontend.origin=${FRONTEND_ORIGIN:http://localhost:8081}

# ---------------------------------------------------------------- PostgreSQL / pgvector
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recouvrag_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=ChatbotPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Le schema est gere par Flyway (db/migration), plus par Hibernate ni par Spring AI.
# baseline-version=0 : une base creee autrefois par initialize-schema (donc sans historique
# Flyway) est adoptee ; V1 est idempotente (IF NOT EXISTS) et s'applique quand meme.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.ai.vectorstore.pgvector.initialize-schema=false
# Verifie au demarrage que la table et la dimension (1536) correspondent a la configuration :
# changer de modele d'embedding sans migrer la table echoue tout de suite, pas a la premiere requete.
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine-distance

# ---------------------------------------------------------------- Connaissances (RAG)
# Nombre de passages injectes et score de similarite cosinus minimal : sans seuil, chaque
# question recevait des passages sans rapport. A recalibrer sur un jeu de questions reelles.
app.rag.top-k=4
app.rag.similarity-threshold=0.5
# Nouvelle tentative d'indexation si la premiere a echoue (OpenAI indisponible au demarrage).
app.rag.ingestion.retry-ms=600000

# Une reponse en flux (SSE) dure aussi longtemps que la generation : le delai par defaut (30 s) la coupait.
spring.mvc.async.request-timeout=180s

# ---------------------------------------------------------------- Limites d'usage du chatbot
# Par utilisateur : chaque question appelle gpt-4o (cout) et peut declencher des outils.
app.rag.chat.per-minute=5
app.rag.chat.per-hour=60

# ---------------------------------------------------------------- Actuator
# Uniquement les sondes de sante, sans detail.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-stacktrace=never
server.error.include-message=never
# Derriere le proxy nginx : IP client via X-Forwarded-For (proxys internes uniquement).
server.forward-headers-strategy=native
