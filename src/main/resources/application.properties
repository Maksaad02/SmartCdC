# Application
spring.application.name=recouvTech_db

# Charge le fichier .env local s'il existe (il est git-ignore).
# "optional:" : en production le fichier est absent et les valeurs viennent des
# vraies variables d'environnement. Si ni l'un ni l'autre ne fournit les secrets,
# le demarrage echoue volontairement plutot que de retomber sur une valeur par
# defaut embarquee dans le binaire.
spring.config.import=optional:file:./.env[.properties]
debug=false

# Database (updated for Docker MySQL service)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rec_ouv_db?serverTimezone=UTC&useSSL=true&requireSSL=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.pool-name=RecouvBackPool
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepaliveTime=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=60000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# Development Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.transaction=WARN

# Amorcage du premier compte ADMIN (voir AdminInitializer).
# Ignore des qu'au moins un utilisateur existe en base.
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrateur}

app.secret-key=${JWT_SECRET}
app.expiration-time=3600000

# Spring Security Debugging
logging.level.org.springframework.security=WARN
logging.level.com.recouvtech.recouvback.filter=WARN

# SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
logging.level.org.springframework.mail=WARN
logging.level.org.springframework.boot.autoconfigure.mail=WARN

# CORS (controller-level annotations + SecurityConfig bean used)

# External Chatbot API Security
recouv.api.external.key=${CHATBOT_API_KEY}
