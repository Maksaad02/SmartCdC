spring.application.name=recouvChatbot_rag
server.port=8082

# AI OpenAI Configuration
spring.ai.openai.api-key=
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Backend API Configuration
# Use 'localhost:8080' if running app from IntelliJ
# Use 'main-app:8080' if running app inside Docker
recouv.backend.base-url=http://localhost:8080
recouv.backend.api-key=SECRET_CHATBOT_KEY_12345_CHANGE_IN_PRODUCTION

# PostgreSQL Configuration (Matching Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/recouvrag_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Vector Store Initialization
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536

# Disable Spring Boot's internal docker-compose manager to avoid conflicts
spring.docker.compose.enabled=false