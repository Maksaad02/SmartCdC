spring.application.name=recouvChatbot_rag
server.port=8082

# AI OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Backend API Configuration
# Use 'localhost:8080' if running app from IntelliJ
# Use 'main-app:8080' if running app inside Docker
recouv.backend.base-url=http://localhost:8080
recouv.backend.api-key=${BACKEND_API_KEY}

# Secret de signature JWT, partage avec le backend : le chatbot valide le meme
# jeton utilisateur et le retransmet, afin d'heriter exactement des droits de
# l'agent appelant plutot que d'exposer un acces anonyme global.
app.secret-key=${JWT_SECRET}

# Origine autorisee du front (plus de wildcard).
recouv.frontend.origin=${FRONTEND_ORIGIN:http://localhost:8081}

# PostgreSQL Configuration (Matching Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/recouvrag_db
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Vector Store Initialization
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536

# Disable Spring Boot's internal docker-compose manager to avoid conflicts
spring.docker.compose.enabled=false